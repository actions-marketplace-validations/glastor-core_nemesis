# Nemesis Security & Hygiene Configuration (.nemesis.yml)
version: "1"

# Reglas de exclusión y justificación de falsos positivos
# Toda exclusión requiere obligatoriamente una razón ('reason')
ignore: []
  # - id: "SAST-1"
  #   path: "tests/fixtures/**"
  #   reason: "Datos de prueba simulados en ambiente mock"
  #   expires: "2026-12-31"

settings:
  maxFileSizeMb: 10
  requireLicense: false
