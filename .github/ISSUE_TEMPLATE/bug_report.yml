name: "🐛 Reporte de Bug"
description: "Reporta un problema técnico, error en escaneo o fallo de remediación"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar este problema.
        Proporcionar detalles específicos sobre el entorno y los scanners activos agiliza enormemente la resolución.

  - type: textarea
    id: summary
    attributes:
      label: "Descripción del fallo"
      description: "Explica de forma concisa qué falló o qué comportamiento anómalo se presentó."
      placeholder: "Ejemplo: El scanner de higiene no detectó archivos temporales de emacs..."
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: "Módulo o Scanner afectado"
      description: "¿Qué componente de Nemesis presentó el problema?"
      options:
        - "Higiene y Limpieza de Repositorio"
        - "Secretos (Gitleaks)"
        - "SAST (Semgrep)"
        - "SCA / Dependencias (Trivy)"
        - "Cumplimiento de Licencias y SBOM"
        - "Auto-Fix & Commits de Limpieza"
        - "GitHub PR Review Suggestions"
        - "Composite GitHub Action (action.yml)"
        - "CLI / Orquestador Principal"
        - "Otro / No especificado"
    validations:
      required: true

  - type: dropdown
    id: runtime_mode
    attributes:
      label: "Modo de Ejecución"
      description: "¿Cómo estás ejecutando Nemesis?"
      options:
        - "GitHub Action (pipeline CI/CD)"
        - "Deno CLI local (deno task start / deno run)"
        - "Binario compilado independiente (bin/nemesis)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducir"
      description: "Secuencia determinista de pasos para replicar el problema."
      placeholder: |
        1. Configurar .nemesis.yml con...
        2. Ejecutar `deno task start --path .`
        3. Observar la salida errónea...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Comportamiento esperado"
      description: "¿Qué resultado debió haber arrojado la auditoría o la remediación?"
      placeholder: "Ej: Debería reportar 1 advertencia de severidad MEDIUM..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Comportamiento real observado"
      description: "¿Qué ocurrió en realidad?"
      placeholder: "Ej: Se produjo un error de ejecución o se omitió el archivo..."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Versión de Nemesis"
      description: "Tag de versión, rama o hash del commit utilizado."
      placeholder: "v1.1.0 / master / commit 9d872e5"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: "Sistema Operativo"
      options:
        - "Linux (Ubuntu / Debian / Alpine)"
        - "macOS"
        - "Windows"
        - "GitHub Hosted Runner"
        - "Otro"
    validations:
      required: false

  - type: input
    id: deno_version
    attributes:
      label: "Versión de Deno"
      description: "Salida del comando `deno --version`."
      placeholder: "deno 2.x.x"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Logs y salida de terminal"
      description: "Pega la traza de error, logs de GitHub Actions o reporte relevante."
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "Confirmaciones"
      options:
        - label: "He verificado que este bug no haya sido reportado previamente en GitHub Issues."
          required: true
        - label: "He confirmado que este reporte no contiene secretos, tokens ni contraseñas reales."
          required: true
